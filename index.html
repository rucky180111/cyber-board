<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CYBER BOARD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060f; --panel:#0a0f22; --line:rgba(0,240,255,.22);
  --cy:#00f0ff; --mg:#ff2bd6; --p3:#8dff3a; --p4:#ff9d2e; --yl:#f6ff00; --tx:#d7f6ff; --dim:#6f8aa5;
  --disp:"Orbitron","Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  background-image:
    linear-gradient(rgba(0,240,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,.06) 1px,transparent 1px),
    radial-gradient(ellipse at 50% -10%,rgba(255,43,214,.18),transparent 60%);
  background-size:40px 40px,40px 40px,100% 100%;
  background-attachment:fixed;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.5}
#app{max-width:1040px;margin:0 auto;padding:16px;position:relative;z-index:1}

.logo{font-family:var(--disp);font-weight:900;letter-spacing:.14em;margin:0;
  color:var(--cy);text-shadow:0 0 12px var(--cy),0 0 32px rgba(0,240,255,.5)}
.logo span{color:var(--mg);text-shadow:0 0 12px var(--mg),0 0 32px rgba(255,43,214,.5)}
.sub{font-family:var(--disp);font-size:11px;letter-spacing:.3em;color:var(--dim);margin:6px 0 0}

.panel{background:linear-gradient(180deg,rgba(10,15,34,.95),rgba(6,9,22,.95));
  border:1px solid var(--line);padding:18px;position:relative;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
  box-shadow:inset 0 0 30px rgba(0,240,255,.05)}
h2{font-family:var(--disp);font-size:12px;letter-spacing:.22em;color:var(--cy);margin:0 0 12px}
h2:not(:first-child){margin-top:22px}

label{display:block;font-family:var(--disp);font-size:10px;letter-spacing:.25em;color:var(--dim);margin:14px 0 6px}
input{width:100%;background:#03050d;border:1px solid var(--line);color:var(--tx);
  padding:12px;font-size:16px;outline:none;font-family:inherit}
input:focus{border-color:var(--cy);box-shadow:0 0 12px rgba(0,240,255,.4)}
#code{font-family:var(--disp);letter-spacing:.4em;text-transform:uppercase;text-align:center}

.btn{display:inline-block;width:100%;margin-top:14px;padding:12px 14px;cursor:pointer;
  background:transparent;border:1px solid var(--cy);color:var(--cy);
  font-family:inherit;font-weight:700;font-size:14px;letter-spacing:.08em;
  transition:.15s;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.btn:hover:not(:disabled){background:rgba(0,240,255,.14);box-shadow:0 0 18px rgba(0,240,255,.45)}
.btn.primary{background:var(--cy);color:#001318}
.btn.primary:hover:not(:disabled){background:#7ff8ff}
.btn.mg{border-color:var(--mg);color:var(--mg)}
.btn.mg:hover:not(:disabled){background:rgba(255,43,214,.14);box-shadow:0 0 18px rgba(255,43,214,.45)}
.btn.sm{width:auto;margin:0;padding:7px 12px;font-size:12px}
.btn.big{font-family:var(--disp);letter-spacing:.3em;padding:16px;font-size:16px}
.btn:disabled{opacity:.35;cursor:not-allowed}

.entry{max-width:420px;margin:8vh auto 0;text-align:center}
.entry .logo{font-size:clamp(30px,9vw,46px)}
.entry .panel{margin-top:28px;text-align:left}
.or{text-align:center;color:var(--dim);font-family:var(--disp);font-size:10px;letter-spacing:.3em;margin:20px 0 0}
.err{color:var(--mg);font-size:13px;min-height:1.2em;margin:14px 0 0}
.wait{text-align:center;margin-top:30vh;font-family:var(--disp);letter-spacing:.2em;color:var(--cy);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.top .logo{font-size:20px;margin-right:auto}
.room{font-family:var(--disp);font-size:12px;letter-spacing:.15em;color:var(--dim)}
.room b{color:var(--yl);font-size:18px;letter-spacing:.3em;margin-left:6px;text-shadow:0 0 10px rgba(246,255,0,.6)}
.offline{background:rgba(255,43,214,.12);border:1px solid var(--mg);color:var(--mg);padding:10px 14px;margin-bottom:14px;font-size:13px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}}

.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.connect4{padding:1.5%;background:#070d24}
.connect4 .cell::before{content:"";position:absolute;inset:8%;border-radius:50%;border:1px solid rgba(0,240,255,.3);background:#02030a}
.connect4 .stone{inset:8%;z-index:1}
.connect4 .hint::after{content:"";position:absolute;inset:40%;border-radius:50%;background:var(--yl);opacity:.75;box-shadow:0 0 8px var(--yl);z-index:1}
.fx .last .stone,.fx .gcell.last .gp{animation:fxspawn .45s cubic-bezier(.2,1.6,.4,1)}
.fx .last .stone::after,.fx .gcell.last .gp::after{content:"";position:absolute;inset:-6%;border-radius:50%;border:2px solid #fff;pointer-events:none;animation:fxring .6s ease-out forwards}
@keyframes fxspawn{0%{transform:scale(0);filter:brightness(4)}60%{filter:brightness(2)}100%{transform:scale(1);filter:brightness(1)}}
@keyframes fxring{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
.fx .connect4 .last .stone{animation:drop .4s cubic-bezier(.5,0,.8,.4)}
.fx .flip .stone{animation:fxflip .5s ease-out}
@keyframes fxflip{0%{transform:rotateY(180deg) scale(1.25);filter:brightness(3.5)}100%{transform:none;filter:none}}
.fx .qwall.new{animation:fxwall .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes fxwall{0%{transform:scale(0);filter:brightness(4)}100%{transform:none;filter:none}}
.fx .pl.act{animation:fxturn .6s ease-out}
@keyframes fxturn{0%{filter:brightness(2.6)}100%{filter:none}}
.fx .htab tr.nw td{animation:fxrow .8s ease-out}
@keyframes fxrow{0%{background:rgba(246,255,0,.55)}100%{background:transparent}}
.fxtog{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:var(--disp);font-size:9px;letter-spacing:.12em;padding:4px 7px;cursor:pointer}
.fxtog.on{border-color:var(--cy);color:var(--cy)}
.fxov{position:fixed;inset:0;z-index:50;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;animation:fxfade 2.7s ease-out forwards}
@keyframes fxfade{0%{background:rgba(255,255,255,.4)}7%{background:rgba(3,5,13,.74)}80%{background:rgba(3,5,13,.74);opacity:1}100%{background:rgba(3,5,13,0);opacity:0}}
.fxbar{position:absolute;left:0;right:0;top:50%;height:24vmin;background:linear-gradient(90deg,transparent,currentColor 20%,currentColor 80%,transparent);opacity:.16;transform:translateY(-50%) scaleX(0);animation:fxbar .5s cubic-bezier(.2,1,.3,1) .05s forwards}
@keyframes fxbar{to{transform:translateY(-50%) scaleX(1)}}
.fxtxt{position:relative;font-family:var(--disp);font-weight:900;font-size:clamp(40px,13vw,120px);letter-spacing:.08em;white-space:nowrap;color:#fff;text-shadow:0 0 18px currentColor,0 0 60px currentColor;animation:fxin .55s cubic-bezier(.2,1.5,.3,1) both}
.fxtxt::before,.fxtxt::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;text-shadow:none;opacity:.85;mix-blend-mode:screen}
.fxtxt::before{color:var(--cy);animation:fxsl 1.1s steps(1) .35s 1 both}
.fxtxt::after{color:var(--mg);animation:fxsr 1.1s steps(1) .35s 1 both}
@keyframes fxin{0%{transform:scale(3.2);opacity:0;filter:blur(12px)}100%{transform:scale(1);opacity:1;filter:blur(0)}}
@keyframes fxsl{0%,100%{transform:none;clip-path:inset(0 0 100% 0)}15%{transform:translate(-7px,2px);clip-path:inset(10% 0 55% 0)}35%{transform:translate(5px,-2px);clip-path:inset(62% 0 8% 0)}55%{transform:translate(-4px,0);clip-path:inset(30% 0 40% 0)}75%{transform:translate(3px,1px);clip-path:inset(75% 0 5% 0)}}
@keyframes fxsr{0%,100%{transform:none;clip-path:inset(0 0 100% 0)}15%{transform:translate(7px,-2px);clip-path:inset(58% 0 12% 0)}35%{transform:translate(-5px,2px);clip-path:inset(8% 0 62% 0)}55%{transform:translate(4px,0);clip-path:inset(45% 0 25% 0)}75%{transform:translate(-3px,-1px);clip-path:inset(5% 0 80% 0)}}
.fxsub{position:relative;margin-top:10px;font-family:var(--disp);letter-spacing:.3em;font-size:clamp(11px,3vw,18px);animation:fxin .5s ease-out .25s both}
.fxov.win{color:var(--yl)}
.fxov.lose{color:var(--mg)}
.fxov.draw{color:var(--tx)}
.fxov.lose .fxtxt{font-size:clamp(30px,9vw,80px)}
.fxp{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);background:currentColor;box-shadow:0 0 10px currentColor;animation:fxp 1.2s cubic-bezier(.1,.8,.3,1) var(--d) both}
.fxp:nth-child(3n){color:var(--cy)}
.fxp:nth-child(3n+1){color:var(--mg)}
@keyframes fxp{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(0) rotate(200deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.fx *{animation:none!important}.fxov{display:none}}
.connect4 .win .stone{animation:pulse .8s infinite alternate}
@keyframes drop{from{transform:translateY(-320%);opacity:.3}}
.game{background:#03050d;border:1px solid var(--line);color:var(--tx);padding:16px 12px;cursor:pointer;text-align:left;font-family:inherit;transition:.15s}
.game b{display:block;font-size:17px;margin-bottom:6px}
.game small{color:var(--dim);font-size:12px;line-height:1.5;display:block}
.game.on{border-color:var(--cy);box-shadow:0 0 18px rgba(0,240,255,.4),inset 0 0 18px rgba(0,240,255,.12)}
.game.on b{color:var(--cy)}
.game:disabled{cursor:default}
.note{color:var(--dim);font-size:13px;margin:0 0 12px}

.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.vs.four{grid-template-columns:1fr 1fr}
.modes{display:flex;gap:10px;margin-top:12px}
.modes button{flex:1;background:#03050d;border:1px solid var(--line);color:var(--dim);padding:10px;font-family:inherit;font-weight:700;cursor:pointer}
.modes button.on{border-color:var(--cy);color:var(--cy);box-shadow:0 0 12px rgba(0,240,255,.35)}
.modes button:disabled{cursor:default}
.vs>span{font-family:var(--disp);font-weight:900;color:var(--dim)}
.slot{border:1px solid;padding:12px 8px;text-align:center;min-width:0}
.slot small{display:block;font-family:var(--disp);font-size:9px;letter-spacing:.2em;margin-bottom:4px}
.slot div{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c1{color:var(--cy);border-color:var(--cy)}
.c2{color:var(--mg);border-color:var(--mg)}
.c3{color:var(--p3);border-color:var(--p3)}
.c4{color:var(--p4);border-color:var(--p4)}
.slot.empty div{opacity:.4;font-weight:400}

.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pl{border:1px solid;padding:8px 12px;display:flex;align-items:center;gap:10px;opacity:.5;min-width:0}
.pl.act{opacity:1;box-shadow:0 0 16px currentColor,inset 0 0 14px rgba(255,255,255,.06)}
.pl span{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl b{font-family:var(--disp);font-size:20px}
.dot{width:14px;height:14px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;flex:none}
.msg{text-align:center;padding:10px;margin-bottom:10px;font-weight:700;border:1px dashed var(--line);min-height:44px}
.msg.win{border:1px solid var(--yl);color:var(--yl);font-size:18px;text-shadow:0 0 10px rgba(246,255,0,.6);box-shadow:0 0 20px rgba(246,255,0,.25)}
.msg small{display:block;font-weight:400;color:var(--dim);font-size:12px;margin-top:2px;text-shadow:none}

.board{display:grid;grid-template-columns:repeat(var(--n),1fr);width:min(100%,560px);aspect-ratio:1;margin:0 auto;
  background:#03060f;border:1px solid var(--cy);box-shadow:0 0 24px rgba(0,240,255,.35),inset 0 0 40px rgba(0,240,255,.06)}
.cell{position:relative;border:0;background:transparent;padding:0;margin:0;cursor:pointer;min-width:0}
.cell:disabled{cursor:default}
.reversi .cell{border:1px solid rgba(0,240,255,.16)}
.gomoku .cell{background:
  linear-gradient(rgba(0,240,255,.28),rgba(0,240,255,.28)) center/100% 1px no-repeat,
  linear-gradient(rgba(0,240,255,.28),rgba(0,240,255,.28)) center/1px 100% no-repeat}
.cell:not(:disabled):hover{background-color:rgba(246,255,0,.14)}
.reversi .hint::after{content:"";position:absolute;inset:40%;border-radius:50%;background:var(--yl);opacity:.75;box-shadow:0 0 8px var(--yl)}
.stone{position:absolute;inset:11%;border-radius:50%;display:block}
.gomoku .stone{inset:7%}
.s1{background:radial-gradient(circle at 35% 30%,#d9ffff,#00f0ff 45%,#00596b);box-shadow:0 0 10px var(--cy)}
.s2{background:radial-gradient(circle at 35% 30%,#ffe0f8,#ff2bd6 45%,#5d0a4c);box-shadow:0 0 10px var(--mg)}
.s3{background:radial-gradient(circle at 35% 30%,#f1ffe0,#8dff3a 45%,#2b5d0a);box-shadow:0 0 10px var(--p3)}
.s4{background:radial-gradient(circle at 35% 30%,#fff1dc,#ff9d2e 45%,#6b3a05);box-shadow:0 0 10px var(--p4)}
.jk{max-width:520px;margin:10px auto 0;display:grid;gap:10px}
.jside{border:1px solid;padding:10px;background:rgba(255,255,255,.03)}
.jhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:700}
.jhead em{font-style:normal;font-size:11px;color:var(--yl);margin-left:6px}
.jhead b{font-family:var(--disp);font-size:20px}
.jhand{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.jgrp{text-align:center;min-width:0}
.jgrp small{display:block;margin-top:4px;font-size:11px;color:var(--dim)}
.jrow{display:flex;gap:4px;justify-content:center}
.jcard{flex:1;max-width:46px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid currentColor;background:#03060f;font-size:clamp(14px,4.6vw,20px);font-style:normal;padding:0;margin:0;color:inherit;line-height:1}
button.jcard{cursor:pointer;touch-action:manipulation}
button.jcard:disabled{cursor:default}
.jcard.used{opacity:.15;border-style:dashed}
.jcard.sel{background:rgba(246,255,0,.25);border-color:var(--yl);box-shadow:0 0 12px var(--yl)}
.jlast{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;padding:8px;border:1px dashed var(--line)}
.jlast span{font-weight:700;color:var(--yl);font-size:13px}
.jlast.empty{display:block;color:var(--dim);font-size:12px}
.jbig{display:inline-block;font-size:32px;font-weight:400;line-height:1.1}
.jc{width:1.15em;height:1.15em;vertical-align:-.22em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 2px currentColor)}
.jcard .jc{width:66%;height:66%}
.jlast.ready{display:block;padding:14px 8px;border-style:solid;border-color:var(--yl);animation:blink .5s infinite}
.jlast.ready b{display:block;font-family:var(--disp);font-size:26px;letter-spacing:.3em;color:var(--yl);text-shadow:0 0 12px var(--yl)}
.jlast.pop{animation:don .5s ease-out}
.jlast.pop .jbig{animation:donb .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes don{0%{background:rgba(246,255,0,.55);box-shadow:0 0 40px var(--yl)}100%{background:transparent;box-shadow:none}}
@keyframes donb{0%{transform:scale(2.8);opacity:0}55%{opacity:1}100%{transform:scale(1)}}
.jbig small{display:block;font-size:11px;font-family:var(--disp)}
.jlog{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--dim);justify-content:center}
.hb{max-width:560px;margin:10px auto 0}
.hsides,.htabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hside{border:1px solid;padding:10px 6px;text-align:center;background:rgba(255,255,255,.03);min-width:0}
.hname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hname small{display:block;font-weight:400;font-size:11px;color:var(--dim)}
.hdig{display:flex;gap:6px;justify-content:center;margin-top:8px}
.hdig b{width:26%;max-width:56px;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:clamp(20px,6vw,30px);border:1px solid currentColor;background:#03060f;box-shadow:inset 0 0 10px currentColor}
.hdig b.q{opacity:.5}
.htabs{margin-top:10px}
.htab{width:100%;border-collapse:collapse;table-layout:fixed}
.htab th{font-size:11px;padding:6px 2px;border-bottom:1px solid currentColor}
.htab th:first-child{width:60%}
.htab td{height:30px;text-align:center;border:1px solid rgba(0,240,255,.15);color:var(--tx);font-family:var(--disp);font-size:15px;letter-spacing:.1em}
.htab tr.hit td{color:var(--yl);text-shadow:0 0 8px var(--yl)}
.hin{max-width:420px;margin:14px auto 0;text-align:center}
.hin p{margin:0 0 8px;color:var(--cy);font-size:13px}
.hdisp{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
.hdisp b{width:54px;height:60px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:32px;color:var(--cy);border:1px solid var(--cy);background:#03060f;box-shadow:0 0 12px rgba(0,240,255,.4)}
.hkeys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.hkeys button{min-height:50px;background:rgba(0,240,255,.08);border:1px solid var(--line);color:var(--tx);font-family:var(--disp);font-size:22px;cursor:pointer;touch-action:manipulation}
.hkeys button:disabled{opacity:.25;cursor:not-allowed}
.hkeys .ok{grid-column:span 4;background:var(--yl);color:#111;border-color:var(--yl);font-family:inherit;font-weight:700;font-size:16px}
.hkeys .del{color:var(--mg);border-color:var(--mg)}
.gboard{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,420px);aspect-ratio:1;margin:12px auto}
.gcell{position:relative;background:#03060f;border:1px solid rgba(0,240,255,.3);padding:0;margin:0;cursor:pointer;touch-action:manipulation;box-shadow:inset 0 0 20px rgba(0,240,255,.06)}
.gcell:disabled{cursor:default}
.gcell.hint{border-color:var(--yl);background:rgba(246,255,0,.13)}
.gcell.sel{border-color:#fff;box-shadow:0 0 14px #fff}
.gcell.last .gp{outline:2px solid var(--yl);outline-offset:2px}
.gcell.win .gp{animation:pulse .8s infinite alternate}
.gp{border-radius:50%;display:block}
.trail{opacity:.3}
.gr{position:absolute;border-radius:50%;border:1px dashed rgba(215,246,255,.28);pointer-events:none}
.gcell .gp{position:absolute}
.gcell .z1{inset:34%}
.gcell .z2{inset:21%}
.gcell .z3{inset:7%}
.pad.ghand button{flex:1;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--tx)}
.pad.ghand button.on{border-color:#fff;box-shadow:0 0 14px #fff}
.ghand .z1{width:14px;height:14px}
.ghand .z2{width:24px;height:24px}
.ghand .z3{width:36px;height:36px}
.pl b.gh{font-family:inherit;font-size:11px;white-space:nowrap}
.qboard{position:relative;width:min(100%,540px);aspect-ratio:1;margin:12px auto}
.qcell{position:absolute;width:9.091%;height:9.091%;border:1px solid rgba(0,240,255,.22);background:#03060f;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
.qcell:disabled{cursor:default}
.qcell.hint{border-color:var(--yl);background:rgba(246,255,0,.14)}
.qcell.hint::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--yl);box-shadow:0 0 8px var(--yl)}
.qwall{position:absolute;border-radius:2px;pointer-events:none;z-index:2;background:#fff}
.qwall.w1{background:var(--cy);box-shadow:0 0 8px var(--cy)}
.qwall.w2{background:var(--mg);box-shadow:0 0 8px var(--mg)}
.qwall.w3{background:var(--p3);box-shadow:0 0 8px var(--p3)}
.qwall.w4{background:var(--p4);box-shadow:0 0 8px var(--p4)}
.qwall.new{outline:1px solid #fff}
.qwall.ghost{background:var(--yl);box-shadow:0 0 12px var(--yl);z-index:4}

    const size = !sel ? 0 : sel.k === 'h' ? sel.size : gTop(g.st[sel.from]) % 10, from = sel && sel.k === 'b' && sel.from === i;
    if (sel && !from && gCan(g, size, i)) { ui.gs = null; act({ t: 'move', i: sel.k === 'h' ? 1000 + size * 10 + i : 2000 + sel.from * 10 + i }); }
    else if (Math.floor(gTop(g.st[i]) / 10) === my) { ui.gs = from ? null : { k: 'b', from: i }; render(); }
  }
  else if (a === 'qmode') { ui.qmode = el.dataset.m; ui.qa = -1; render(); }
  else if (a === 'qa') { ui.qa = Number(el.dataset.a); render(); }
  else if (a === 'qrot') { ui.qo = ui.qo === 'h' ? 'v' : 'h'; render(); }
  else if (a === 'qput') { const i = (ui.qo === 'h' ? 100 : 200) + ui.qa; if (ui.qa >= 0) { ui.qa = -1; act({ t: 'move', i }); } }
  else if (a === 'put') { const i = ui.sel; ui.sel = -1; if (i >= 0) act({ t: 'move', i }); }
  else if (a === 'nudge') {
    const n = 15, d = Number(el.dataset.d), s = ui.sel < 0 ? 112 : ui.sel;
    const x = s % n + (d === 1 ? 1 : d === 3 ? -1 : 0), y = Math.floor(s / n) + (d === 2 ? 1 : d === 0 ? -1 : 0);
    if (ui.sel < 0) { ui.sel = s; render(); }
    else if (x >= 0 && x < n && y >= 0 && y < n) { ui.sel = y * n + x; render(); }
  }
  else if (a === 'resign') { if (confirm('投了しますか？')) act({ t: 'resign' }); }
  else if (!host || !S) return;
  else if (a === 'game') { if (S.phase === 'lobby' && GAMES[el.dataset.g]) { S.game = el.dataset.g; setNp((GAMES[S.game].modes || []).includes(S.np) ? S.np : 2); broadcast(); } }
  else if (a === 'np') { const n = Number(el.dataset.n); if (S.phase === 'lobby' && (GAMES[S.game].modes || []).includes(n)) { setNp(n); broadcast(); } }
  else if (a === 'role') setRole(el.dataset.cid, el.dataset.role);
  else if (a === 'statreset') { if (confirm('全員の勝敗記録をリセットしますか？')) { S.stats = {}; broadcast(); } }
  else if (a === 'kick') {
    const m = S.members.find(x => x.cid === el.dataset.cid);
    if (m && !m.host && confirm(m.name + ' をKICKしますか？' + (colorOf(m.cid) && S.phase === 'playing' ? ' 対局中のため、ゲームは中断されます。' : ''))) removeMember(m.cid, true);
  }
  else if (a === 'start') startGame();
  else if (a === 'swap') { if (allSet()) { const n = NP(); S.members.forEach(m => { const k = colorOf(m.cid); if (k) m.role = 'p' + (k % n + 1); }); startGame(); } }
  else if (a === 'lobby') { if (S.phase !== 'playing' || confirm('ゲームを中断しますか？')) { S.phase = 'lobby'; S.members = S.members.filter(m => m.online || m.role !== 'spec'); broadcast(); } }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || ui.screen !== 'entry') return;
  const b = document.querySelector(e.target.id === 'code' ? '[data-act=join]' : e.target.id === 'name' && me.code ? '[data-act=join]' : null);
  if (b) b.click();
});

// ---------- boot ----------
(function boot() {
  const q = (new URLSearchParams(location.search).get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  me.code = q;
  if (typeof mqtt === 'undefined') { ui.error = '通信ライブラリを読み込めませんでした。ネット接続を確認して再読み込みしてください。'; render(); return; }
  if (CODE_RE.test(q) && me.name && store.get('cb_host', true) === q) { rehost = true; createRoom(); return; }
  if (CODE_RE.test(q) && me.name && store.get('cb_guest', true) === q) { joinRoom(); return; }
  render();
})();
</script>
