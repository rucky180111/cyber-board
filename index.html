<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CYBER BOARD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060f; --panel:#0a0f22; --line:rgba(0,240,255,.22);
  --cy:#00f0ff; --mg:#ff2bd6; --p3:#8dff3a; --p4:#ff9d2e; --yl:#f6ff00; --tx:#d7f6ff; --dim:#6f8aa5;
  --disp:"Orbitron","Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden;overflow-x:clip;max-width:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  background-image:
    linear-gradient(rgba(0,240,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,.06) 1px,transparent 1px),
    radial-gradient(ellipse at 50% -10%,rgba(255,43,214,.18),transparent 60%);
  background-size:40px 40px,40px 40px,100% 100%;
  background-attachment:fixed;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.5}
#app{max-width:1040px;margin:0 auto;padding:16px;position:relative;z-index:1}

.logo{font-family:var(--disp);font-weight:900;letter-spacing:.14em;margin:0;
  color:var(--cy);text-shadow:0 0 12px var(--cy),0 0 32px rgba(0,240,255,.5)}
.logo span{color:var(--mg);text-shadow:0 0 12px var(--mg),0 0 32px rgba(255,43,214,.5)}
.sub{font-family:var(--disp);font-size:11px;letter-spacing:.3em;color:var(--dim);margin:6px 0 0}

.panel{background:linear-gradient(180deg,rgba(10,15,34,.95),rgba(6,9,22,.95));
  border:1px solid var(--line);padding:18px;position:relative;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
  box-shadow:inset 0 0 30px rgba(0,240,255,.05)}
h2{font-family:var(--disp);font-size:12px;letter-spacing:.22em;color:var(--cy);margin:0 0 12px}
h2:not(:first-child){margin-top:22px}

label{display:block;font-family:var(--disp);font-size:10px;letter-spacing:.25em;color:var(--dim);margin:14px 0 6px}
input{width:100%;background:#03050d;border:1px solid var(--line);color:var(--tx);
  padding:12px;font-size:16px;outline:none;font-family:inherit}
input:focus{border-color:var(--cy);box-shadow:0 0 12px rgba(0,240,255,.4)}
#code{font-family:var(--disp);letter-spacing:.4em;text-transform:uppercase;text-align:center}

.btn{display:inline-block;width:100%;margin-top:14px;padding:12px 14px;cursor:pointer;
  background:transparent;border:1px solid var(--cy);color:var(--cy);
  font-family:inherit;font-weight:700;font-size:14px;letter-spacing:.08em;
  transition:.15s;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.btn:hover:not(:disabled){background:rgba(0,240,255,.14);box-shadow:0 0 18px rgba(0,240,255,.45)}
.btn.primary{background:var(--cy);color:#001318}
.btn.primary:hover:not(:disabled){background:#7ff8ff}
.btn.mg{border-color:var(--mg);color:var(--mg)}
.btn.mg:hover:not(:disabled){background:rgba(255,43,214,.14);box-shadow:0 0 18px rgba(255,43,214,.45)}
.btn.sm{width:auto;margin:0;padding:7px 12px;font-size:12px}
.btn.big{font-family:var(--disp);letter-spacing:.3em;padding:16px;font-size:16px}
.btn:disabled{opacity:.35;cursor:not-allowed}

.entry{max-width:420px;margin:8vh auto 0;text-align:center}
.entry .logo{font-size:clamp(30px,9vw,46px)}
.entry .panel{margin-top:28px;text-align:left}
.or{text-align:center;color:var(--dim);font-family:var(--disp);font-size:10px;letter-spacing:.3em;margin:20px 0 0}
.err{color:var(--mg);font-size:13px;min-height:1.2em;margin:14px 0 0}
.wait{text-align:center;margin-top:30vh;font-family:var(--disp);letter-spacing:.2em;color:var(--cy);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}

.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top .fxtog{order:3;flex:none;white-space:nowrap}
.top .room{white-space:nowrap}
.top .logo{font-size:20px;margin-right:auto}
.room{font-family:var(--disp);font-size:12px;letter-spacing:.15em;color:var(--dim)}
.room b{color:var(--yl);font-size:18px;letter-spacing:.3em;margin-left:6px;text-shadow:0 0 10px rgba(246,255,0,.6)}
.offline{background:rgba(255,43,214,.12);border:1px solid var(--mg);color:var(--mg);padding:10px 14px;margin-bottom:14px;font-size:13px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
.layout>*{min-width:0}

.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:10px}
.connect4{padding:1.5%;background:#070d24}
.connect4 .cell::before{content:"";position:absolute;inset:8%;border-radius:50%;border:1px solid rgba(0,240,255,.3);background:#02030a}
.connect4 .stone{inset:8%;z-index:1}
.connect4 .hint::after{content:"";position:absolute;inset:40%;border-radius:50%;background:var(--yl);opacity:.75;box-shadow:0 0 8px var(--yl);z-index:1}
.fx .qboard:has(.qwall.new) .qcell.last .stone{animation:none!important}
.fx .last .stone,.fx .gcell.last .gp{animation:fxslam .42s cubic-bezier(.2,.9,.3,1)}
@keyframes fxslam{0%{transform:scale(2.3);opacity:0;filter:brightness(4) blur(2px)}55%{transform:scale(.86);opacity:1;filter:brightness(2.4)}78%{transform:scale(1.06)}100%{transform:none;filter:none}}
.bst{position:fixed;z-index:30;width:0;height:0;pointer-events:none}
.bsp{position:absolute;width:var(--w,4px);height:var(--h,4px);margin:-2px;background:currentColor;box-shadow:0 0 6px currentColor;animation:bsp .55s cubic-bezier(.1,.8,.3,1) var(--d,0s) both}
@keyframes bsp{0%{opacity:1;transform:rotate(var(--r,0deg))}70%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r,0deg)) scale(.2);opacity:0}}
.bsr{position:absolute;width:var(--z);height:var(--z);margin:calc(var(--z)/-2);border:2px solid currentColor;box-shadow:0 0 10px currentColor,inset 0 0 8px currentColor;animation:bsr .5s cubic-bezier(.2,.8,.3,1) both}
.bsr.b{border-width:1px;animation-name:bsrb;animation-duration:.6s}
@keyframes bsr{0%{transform:rotate(45deg) scale(.4);opacity:1}100%{transform:rotate(45deg) scale(2.2);opacity:0}}
@keyframes bsrb{0%{transform:rotate(0) scale(.6);opacity:1}100%{transform:rotate(90deg) scale(2.4);opacity:0}}
.bsl{position:absolute;left:calc(var(--z)*-2.2);top:-.5px;width:calc(var(--z)*4.4);height:1px;background:linear-gradient(90deg,transparent,currentColor 30%,#fff 50%,currentColor 70%,transparent);animation:bsl .32s ease-out both}
.bsl.v{transform:rotate(90deg);animation-name:bslv}
@keyframes bsl{0%{transform:scaleX(0);opacity:1}60%{opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes bslv{0%{transform:rotate(90deg) scaleX(0);opacity:1}60%{opacity:1}100%{transform:rotate(90deg) scaleX(1);opacity:0}}
.scrf{position:fixed;inset:0;z-index:45;pointer-events:none;background:#fff;animation:scrf .28s ease-out both}
@keyframes scrf{0%{opacity:.55}100%{opacity:0}}
.fin .bwrap{animation:finglitch .5s steps(1) .1s}
@keyframes finglitch{0%{transform:translate(-7px,2px) skewX(-6deg);filter:drop-shadow(5px 0 var(--mg)) drop-shadow(-5px 0 var(--cy));clip-path:inset(0 0 0 0)}12%{transform:translate(6px,-3px) skewX(5deg);clip-path:inset(12% 0 55% 0)}24%{transform:translate(-5px,0);filter:drop-shadow(-6px 0 var(--mg)) drop-shadow(6px 0 var(--cy)) brightness(1.6);clip-path:inset(0 0 0 0)}36%{transform:translate(4px,3px) skewX(-3deg);clip-path:inset(58% 0 6% 0)}48%{transform:translate(-3px,-2px);filter:drop-shadow(3px 0 var(--mg)) drop-shadow(-3px 0 var(--cy));clip-path:inset(0 0 0 0)}62%{transform:translate(2px,1px);clip-path:inset(30% 0 38% 0)}76%{transform:translate(-1px,0);filter:drop-shadow(1px 0 var(--mg)) drop-shadow(-1px 0 var(--cy));clip-path:inset(0 0 0 0)}100%{transform:none;filter:none;clip-path:inset(0 0 0 0)}}
.hold .bwrap::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;z-index:7;pointer-events:none;background:linear-gradient(90deg,transparent,var(--cy),#fff,var(--cy),transparent);box-shadow:0 0 14px var(--cy),0 0 40px var(--cy);animation:scanl .48s linear infinite alternate}
@keyframes scanl{from{top:0}to{top:100%}}
.enter .panel{position:relative}
.enter .panel::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;z-index:9;pointer-events:none;background:linear-gradient(90deg,transparent,var(--cy),#fff,var(--cy),transparent);box-shadow:0 0 16px var(--cy);animation:scanp .5s ease-out both}
@keyframes scanp{0%{top:0;opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
.btn:not(:disabled):active{filter:brightness(1.9)}
.fxhud{position:absolute;left:50%;top:50%;width:min(92vw,820px);height:max(34vmin,170px);transform:translate(-50%,-50%);pointer-events:none;color:currentColor;background:linear-gradient(currentColor,currentColor) 0 0/34px 3px no-repeat,linear-gradient(currentColor,currentColor) 0 0/3px 34px no-repeat,linear-gradient(currentColor,currentColor) 100% 0/34px 3px no-repeat,linear-gradient(currentColor,currentColor) 100% 0/3px 34px no-repeat,linear-gradient(currentColor,currentColor) 0 100%/34px 3px no-repeat,linear-gradient(currentColor,currentColor) 0 100%/3px 34px no-repeat,linear-gradient(currentColor,currentColor) 100% 100%/34px 3px no-repeat,linear-gradient(currentColor,currentColor) 100% 100%/3px 34px no-repeat;filter:drop-shadow(0 0 8px currentColor);animation:fxhud .5s cubic-bezier(.2,1.2,.3,1) .05s both}
@keyframes fxhud{0%{transform:translate(-50%,-50%) scale(1.7);opacity:0}60%{opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}
.fxhud::before,.fxhud::after{position:absolute;font-family:var(--disp);font-size:10px;letter-spacing:.25em;opacity:.8;white-space:nowrap}
.fxhud::before{content:"SYS//RESULT";left:8px;top:8px}
.fxhud::after{content:"CYBER BOARD ■ LINK OK";right:8px;bottom:8px}
.fxov.start .fxhud::before{content:"SYS//BOOT"}
.fxgrid{position:absolute;left:-50%;right:-50%;bottom:0;height:46%;pointer-events:none;background:linear-gradient(currentColor 1.5px,transparent 1.5px) 0 0/100% 34px,linear-gradient(90deg,currentColor 1.5px,transparent 1.5px) 50% 0/60px 100%;transform:perspective(320px) rotateX(64deg);transform-origin:50% 100%;-webkit-mask:linear-gradient(transparent,#000 70%);mask:linear-gradient(transparent,#000 70%);opacity:.3;animation:fxgrid .5s linear infinite,finbg .5s ease-out both}
@keyframes fxgrid{to{background-position:0 34px,50% 0}}
.fxscan{position:absolute;left:0;right:0;height:22vmin;top:-22vmin;pointer-events:none;background:linear-gradient(transparent,currentColor);opacity:.14;animation:fxscan 1.1s linear 2}
@keyframes fxscan{to{top:100%}}
.fxsub::before{content:"> "}
.fxsub::after{content:"_";animation:blink .5s steps(1) infinite}
.tchip{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
@media(prefers-reduced-motion:reduce){.fxgrid,.fxscan,.hold .bwrap::after,.enter .panel::after{animation:none;display:none}}
.hint::after{animation:hintp 1.3s ease-in-out infinite}
@keyframes hintp{50%{transform:scale(1.5);opacity:.35}}
.pl.act .dot{animation:blink .9s ease-in-out infinite}
.stone.ghost{animation:blink .8s ease-in-out infinite}
.fx .gcell.last.cov .gp{animation:gcov .55s cubic-bezier(.2,.9,.3,1)}
@keyframes gcov{0%{transform:translateY(-70%) scale(1.5);opacity:0}45%{transform:translateY(0) scale(1.18);opacity:1;filter:brightness(3.5)}60%{transform:scale(.9)}80%{transform:scale(1.05)}100%{transform:none;filter:none}}
.fx .dots .last .stone{animation:dpop .5s cubic-bezier(.2,1.9,.4,1)}
@keyframes dpop{0%{transform:scale(0) rotate(-90deg);filter:brightness(5)}100%{transform:none;filter:none}}
.fx .qboard:not(:has(.qwall.new)) .qcell.last .stone{animation:qhop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes qhop{0%{transform:scale(.3) translateY(-40%);opacity:.2;filter:brightness(4)}60%{transform:scale(1.2)}100%{transform:none;filter:none}}
.fx .stone.trail{animation:qtrail .5s ease-out}
@keyframes qtrail{0%{opacity:1;transform:scale(1.1);filter:brightness(2.5)}}
.dsvg polygon,.dsvg circle{stroke-dasharray:1;stroke-dashoffset:0}
.fx .dsvg polygon,.fx .dsvg circle,.fin .dsvg polygon,.fin .dsvg circle{animation:ddraw .75s cubic-bezier(.3,.7,.3,1) .15s both}
@keyframes ddraw{0%{stroke-dashoffset:1;fill-opacity:0}70%{stroke-dashoffset:0;fill-opacity:0}100%{stroke-dashoffset:0;fill-opacity:1}}
.hold .dsvg,.hold .drule{visibility:hidden}
.fx .drule{animation:finpop .4s cubic-bezier(.2,1.6,.4,1)}
.fin .dots .win .stone{animation:finpop .5s cubic-bezier(.2,1.8,.4,1) .7s both,pulse .5s ease-in-out 1.2s infinite alternate}
.fx .htab tr.nw td{animation:fxrow .9s ease-out both,hbpop .35s cubic-bezier(.2,1.8,.4,1) both}
.fx .htab tr.nw td:nth-child(2){animation-delay:.28s}
.fx .htab tr.nw td:nth-child(3){animation-delay:.5s}
@keyframes hbpop{0%{transform:scale(2);opacity:0}100%{transform:none;opacity:1}}
.htab td{transform-origin:center}
.fin .htab tr.hit td{animation:blink .3s ease-in-out 6}
.fin .reversi .cell{animation:revsweep .5s ease-out calc(var(--w,0) * 45ms) both}
@keyframes revsweep{40%{background:rgba(0,240,255,.28)}}
@media(prefers-reduced-motion:reduce){.bst,.scrf{display:none}.hint::after,.pl.act .dot,.stone.ghost{animation:none}}
@keyframes fxspawn{0%{transform:scale(0);filter:brightness(4)}60%{filter:brightness(2)}100%{transform:scale(1);filter:brightness(1)}}
@keyframes fxring{0%{transform:scale(.6);opacity:1}99%{transform:scale(2.6);opacity:0}100%{transform:scale(.6);opacity:0}}
.fx .connect4 .last .stone{animation:drop .56s cubic-bezier(.55,0,.9,.5)}
.fx .flip .stone{animation:fxflip .5s ease-out calc(var(--fd,0) * 75ms) both}
@keyframes fxflip{0%{transform:rotateY(180deg) scale(.8);filter:brightness(.4) saturate(0)}45%{transform:rotateY(90deg) scale(1.35);filter:brightness(4)}100%{transform:none;filter:none}}
.fx .qwall.new{animation:fxwall .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes fxwall{0%{transform:scale(0);filter:brightness(6)}55%{transform:scale(1.18);filter:brightness(3)}100%{transform:none;filter:none}}
.fx .pl.act{animation:fxturn .6s ease-out}
@keyframes fxturn{0%{filter:brightness(2.6)}100%{filter:none}}
.fx .htab tr.nw td{animation:fxrow .8s ease-out}
@keyframes fxrow{0%{background:rgba(246,255,0,.55)}100%{background:transparent}}
.board,.gboard,.bwrap{position:relative}
.beam{position:absolute;height:6px;margin-top:-3px;transform-origin:0 50%;background:#fff;border-radius:3px;box-shadow:0 0 12px #fff,0 0 30px var(--yl),0 0 60px var(--yl);z-index:5;pointer-events:none;clip-path:inset(-40px 100% -40px 0);animation:beam .45s cubic-bezier(.3,.9,.3,1) .15s forwards,blink .35s ease-in-out .7s infinite}
@keyframes beam{to{clip-path:inset(-40px -40px -40px -40px)}}
@keyframes finpop{0%{transform:scale(0) rotate(-12deg);opacity:0;filter:brightness(5)}100%{transform:none;opacity:1;filter:none}}
@keyframes finwave{0%{transform:none}40%{transform:scale(1.35);filter:brightness(2.6)}100%{transform:none;filter:none}}
@keyframes finbg{from{opacity:0}}
@keyframes finburst{99%{transform:scale(2.4);opacity:0;filter:blur(6px) brightness(3)}100%{transform:scale(.5);opacity:0}}
@keyframes fingoal{50%{transform:scale(1.04);filter:brightness(2.2);box-shadow:0 0 30px 8px currentColor,0 0 80px 20px currentColor}}
@keyframes finko{0%{transform:none;filter:none}15%{transform:translateX(-8px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(6px);filter:brightness(2.6)}100%{transform:scale(.97);filter:grayscale(1) brightness(.55)}}
.fin .win .stone{animation:finpop .5s cubic-bezier(.2,1.8,.4,1) calc(.5s + var(--o,0) * .09s) both,pulse .5s ease-in-out 1.1s infinite alternate}
.fin .gomoku .cell:not(.win) .stone,.fin .connect4 .cell:not(.win) .stone,.fin .gcell:not(.win) .gp{opacity:.28}
.fin .gcell.win .gp{animation:finpop .5s cubic-bezier(.2,1.8,.4,1) calc(.5s + var(--o,0) * .12s) both}
.fin .reversi .stone{animation:finwave .6s ease-out calc(var(--w,0) * 45ms) both}
.fin .qgoal.won{z-index:6;animation:fingoal .5s ease-in-out 3}
.fin .qcell.last{z-index:5}
.fin .qcell.last .stone{animation:finwave .5s ease-out 3}
.fin .qcell.last .stone::after{content:"";position:absolute;inset:-6%;border-radius:50%;border:2px solid #fff;pointer-events:none;animation:fxring .5s ease-out 3}
.jside.ko{filter:grayscale(1) brightness(.6)}
.fin .jside.ko{animation:finko .9s ease-in .5s both}
.finbig{position:absolute;inset:0;z-index:8;pointer-events:none;display:flex;align-items:center;justify-content:center;gap:.22em;font-family:var(--disp);font-weight:900;font-size:clamp(54px,20vw,130px);line-height:1;background:radial-gradient(ellipse at center,rgba(3,5,13,.9),rgba(3,5,13,.45) 65%,transparent);animation:finbg .3s ease-out both}
.finbig b{border:0;text-shadow:0 0 16px currentColor,0 0 50px currentColor;animation:finpop .5s cubic-bezier(.2,1.8,.4,1) calc(.15s + var(--o,0) * .25s) both}
.finbig i{font-style:normal;color:var(--dim);font-size:.5em}
.finbig.num{animation:finbg .3s ease-out both,finburst .4s ease-in 1.55s forwards}
.finbig.num b{color:#fff}
.finbig.cmd .jc{width:1.7em;height:1.7em;stroke-width:1.4;animation:finpop .6s cubic-bezier(.2,1.8,.4,1) .15s both}
.msg.finm{border:1px solid var(--yl);color:var(--yl);font-family:var(--disp);letter-spacing:.25em;font-size:17px;text-shadow:0 0 10px var(--yl);animation:blink .4s infinite}
.dots .cell{background:linear-gradient(rgba(0,240,255,.22),rgba(0,240,255,.22)) center/100% 1px no-repeat,linear-gradient(rgba(0,240,255,.22),rgba(0,240,255,.22)) center/1px 100% no-repeat}
.dots .stone{inset:19%}
.dots .pick{outline:2px solid var(--yl);outline-offset:-2px;background-color:rgba(246,255,0,.25);z-index:1}
.dsvg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:4}
.dsvg polygon{fill:rgba(246,255,0,.14)}
.dsvg circle{fill:none}
.dsvg polygon,.dsvg circle{stroke:var(--yl);stroke-width:.09;stroke-linejoin:round;filter:drop-shadow(0 0 .12px #fff)}
.drule{margin:0 auto 10px;max-width:560px;padding:9px 12px;border:1px solid;text-align:center;font-weight:700;font-size:14px}
.drule.ok{color:var(--yl);border-color:var(--yl);box-shadow:0 0 14px rgba(246,255,0,.3)}
.drule.ng{color:var(--mg);border-color:var(--mg)}
.pad .dclaim{border-color:var(--mg);color:var(--mg)}
.dwarn{text-align:center;margin:8px 0 0;color:var(--mg)}
.pl.out{opacity:.3}
.pl.out span{text-decoration:line-through}
button{transition:transform .08s ease-out}
button:not(:disabled):active{transform:scale(.95)}
@media(hover:hover){.cell:not(:disabled):hover,.gcell:not(:disabled):hover{background:rgba(0,240,255,.1)}}
@keyframes thud{30%{transform:translateY(3px) scale(.995)}}
.fx .bwrap{animation:thud .22s ease-out}
@keyframes msgin{from{opacity:.2;transform:translateY(-4px)}}
.fx .msg{animation:msgin .28s ease-out}
@keyframes holdz{to{transform:scale(1.035);filter:saturate(1.35) brightness(1.12)}}
.hold .bwrap{animation:holdz .95s cubic-bezier(.1,.6,.2,1) both}
.hold .score{opacity:.4}
.hold .panel .btn,.fin .panel .btn{visibility:hidden}
@keyframes panelin{from{opacity:0;transform:translateY(14px) scale(.985);filter:blur(4px)}}
.enter .panel{animation:panelin .4s cubic-bezier(.2,.9,.3,1)}
.tchip{position:fixed;left:50%;top:10px;z-index:40;pointer-events:none;padding:7px 18px;font-family:var(--disp);font-size:12px;letter-spacing:.3em;white-space:nowrap;color:#03050d;background:var(--cy);box-shadow:0 0 18px var(--cy);animation:tchip 1.1s cubic-bezier(.2,1,.3,1) both}
@keyframes tchip{0%{transform:translate(-50%,-150%)}18%,75%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-60%);opacity:0}}
@media(prefers-reduced-motion:reduce){.hold *,.enter *{animation:none!important}.tchip{display:none}}
.bj{max-width:540px;margin:8px auto 0;display:grid;gap:8px}
.bjrow{border:1px solid;padding:8px 10px;background:rgba(255,255,255,.02);opacity:.7}
.bjrow.act,.bjrow.dealer{opacity:1}

.fx .cd.nw{animation:cdin .32s cubic-bezier(.2,1.4,.4,1) calc(var(--st,0) * 90ms) both}

.fx .bjres{animation:finpop .4s cubic-bezier(.2,1.8,.4,1) .5s both}
.el{display:block;width:min(100%,520px);margin:8px auto 6px;overflow:visible}
.hx{fill:#05080f;stroke:rgba(0,240,255,.26);stroke-width:.35}

.fx .eldp.nw{animation:finpop .4s cubic-bezier(.2,1.8,.4,1) calc(var(--st,0) * 220ms + 150ms) both}

.eltx{font-family:var(--disp);font-size:8px;font-weight:900;fill:#03050d;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.crx{font-size:13px;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none;filter:drop-shadow(0 0 3px var(--mg));transform-box:fill-box;transform-origin:center}
.fx .hx.nw{animation:hxin .34s ease-out calc(var(--st,0) * 220ms) both}
@keyframes hxin{0%{fill:#fff;fill-opacity:0;stroke-opacity:0}35%{fill:#fff;fill-opacity:1}}
.fx .elhd{animation:finpop .3s cubic-bezier(.2,1.7,.4,1) calc(var(--st,0) * 220ms - 120ms) both}
.fx .crx{animation:finpop .4s cubic-bezier(.2,1.8,.4,1) calc(var(--st,0) * 220ms + 100ms) both}
.sg{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));gap:3px;width:min(100%,480px);aspect-ratio:1;margin:10px auto 8px}
.sgc{position:relative;min-width:0;min-height:0;overflow:hidden;line-height:1;padding:0;border:1px solid rgba(0,240,255,.4);background:linear-gradient(135deg,#0c1b3a,#060c20);box-shadow:inset 0 0 8px rgba(0,240,255,.12);cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:900;font-size:clamp(13px,4vw,21px);color:var(--tx)}

.gem{width:66%;height:66%;display:flex;align-items:center;justify-content:center;background:currentColor;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border:0}

@keyframes sgopen{0%{background:var(--cy);filter:brightness(3);transform:scale(.6)}}
.fx .sgc.nw .gem{animation:finpop .45s cubic-bezier(.2,1.8,.4,1) .12s both}
.dc{max-width:520px;margin:10px auto 0;display:grid;gap:8px}
.dcrow{display:grid;grid-template-columns:minmax(0,5.5em) 1fr 2.2em 2.8em;gap:8px;align-items:center;opacity:.55;border:0}
.dcrow.act{opacity:1}
.dcrow span{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcrow b{font-family:var(--disp);font-size:18px;text-align:right}
.dcrow.fin{opacity:.9}
.dcrow em{font-style:normal;font-size:12px;font-weight:700;color:var(--yl);text-align:right;white-space:nowrap}
.dcbar{position:relative;height:16px;border:1px solid currentColor;background:#03060f;overflow:hidden}
.dcbar i{position:absolute;left:0;top:0;bottom:0;background:currentColor;box-shadow:0 0 10px currentColor}
.dcbar u{position:absolute;top:0;bottom:0;background:var(--yl);opacity:.8;animation:blink .6s ease-in-out infinite}
.dcmid{display:flex;align-items:center;justify-content:center;gap:22px;padding:18px 0 4px}
.dcdie{width:96px;height:96px;flex:none;border:2px solid currentColor;border-radius:14px;background:#03060f;box-shadow:0 0 18px currentColor,inset 0 0 18px rgba(255,255,255,.06);display:grid;grid-template-columns:repeat(3,1fr);padding:12px;gap:4px;place-items:center}
.dcdie.idle{display:flex;align-items:center;justify-content:center;opacity:.5;font-family:var(--disp);font-size:40px}
.dcdie i{width:14px;height:14px;border-radius:50%}
.dcdie i.on{background:currentColor;box-shadow:0 0 10px currentColor}
.dcdie.bust{color:var(--mg);border-color:var(--mg)}
.dcinfo{min-width:124px;text-align:center}
.dcpot{display:block;font-family:var(--disp);font-size:44px;line-height:1;color:var(--yl);text-shadow:0 0 14px var(--yl)}
.dcpot.bust{color:var(--mg);text-shadow:0 0 14px var(--mg);font-size:28px;letter-spacing:.1em}
.dcinfo small{display:block;margin-top:6px;color:var(--dim);font-size:12px}
.dcgoal{margin:0;text-align:center;font-family:var(--disp);font-size:10px;letter-spacing:.3em;color:var(--dim)}
.fx .dcdie:not(.idle){animation:dcroll .5s cubic-bezier(.2,.8,.3,1)}
@keyframes dcroll{0%{transform:rotate(-220deg) scale(.4);filter:blur(3px) brightness(3)}60%{transform:rotate(14deg) scale(1.15)}100%{transform:none;filter:none}}
.fx .dcdie.bust{animation:dcroll .5s cubic-bezier(.2,.8,.3,1),jshake .45s ease-in-out .5s}
.fx .dcpot{animation:finpop .35s cubic-bezier(.2,1.7,.4,1) .3s both}
.fxtog{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:var(--disp);font-size:9px;letter-spacing:.12em;padding:4px 7px;cursor:pointer}
.fxtog.on{border-color:var(--cy);color:var(--cy)}
.fxov{position:fixed;inset:0;z-index:50;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;animation:fxfade 2.7s ease-out forwards}
@keyframes fxfade{0%{background:rgba(255,255,255,.4)}7%{background:rgba(3,5,13,.74)}80%{background:rgba(3,5,13,.74);opacity:1}100%{background:rgba(3,5,13,0);opacity:0}}
.fxbar{position:absolute;left:0;right:0;top:50%;height:24vmin;background:linear-gradient(90deg,transparent,currentColor 20%,currentColor 80%,transparent);opacity:.16;transform:translateY(-50%) scaleX(0);animation:fxbar .5s cubic-bezier(.2,1,.3,1) .05s forwards}
@keyframes fxbar{to{transform:translateY(-50%) scaleX(1)}}
.fxtxt{position:relative;font-family:var(--disp);font-weight:900;font-size:clamp(40px,13vw,120px);letter-spacing:.08em;white-space:nowrap;color:#fff;text-shadow:0 0 18px currentColor,0 0 60px currentColor;animation:fxin .55s cubic-bezier(.2,1.5,.3,1) both}
.fxtxt::before,.fxtxt::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;text-shadow:none;opacity:.85;mix-blend-mode:screen}
.fxtxt::before{color:var(--cy);animation:fxsl 1.1s steps(1) .35s 1 both}
.fxtxt::after{color:var(--mg);animation:fxsr 1.1s steps(1) .35s 1 both}
@keyframes fxin{0%{transform:scale(3.2);opacity:0;filter:blur(12px)}100%{transform:scale(1);opacity:1;filter:blur(0)}}
@keyframes fxsl{0%,100%{transform:none;clip-path:inset(0 0 100% 0)}15%{transform:translate(-7px,2px);clip-path:inset(10% 0 55% 0)}35%{transform:translate(5px,-2px);clip-path:inset(62% 0 8% 0)}55%{transform:translate(-4px,0);clip-path:inset(30% 0 40% 0)}75%{transform:translate(3px,1px);clip-path:inset(75% 0 5% 0)}}
@keyframes fxsr{0%,100%{transform:none;clip-path:inset(0 0 100% 0)}15%{transform:translate(7px,-2px);clip-path:inset(58% 0 12% 0)}35%{transform:translate(-5px,2px);clip-path:inset(8% 0 62% 0)}55%{transform:translate(4px,0);clip-path:inset(45% 0 25% 0)}75%{transform:translate(-3px,-1px);clip-path:inset(5% 0 80% 0)}}
.fxsub{position:relative;margin-top:10px;font-family:var(--disp);letter-spacing:.3em;font-size:clamp(11px,3vw,18px);animation:fxin .5s ease-out .25s both}
.fxov.win{color:var(--yl)}
.fxov.win,.fxov.spec{animation-duration:3.5s}
.fxrays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax;background:repeating-conic-gradient(currentColor 0 3deg,transparent 3deg 15deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 52%);mask:radial-gradient(circle,#000 0,transparent 52%);animation:fxrays 3.4s linear both}
@keyframes fxrays{0%{opacity:0;transform:rotate(0) scale(.4)}12%{opacity:.26;transform:rotate(6deg) scale(1)}80%{opacity:.2}100%{opacity:0;transform:rotate(50deg) scale(1)}}
.fxrg{position:absolute;left:50%;top:50%;width:30vmin;height:30vmin;margin:-15vmin;border:3px solid currentColor;border-radius:50%;box-shadow:0 0 24px currentColor,inset 0 0 24px currentColor;animation:fxrg 1.1s cubic-bezier(.1,.7,.3,1) both}
.fxrg.b{animation-delay:.22s}.fxrg.c{animation-delay:.5s;border-width:1px}
@keyframes fxrg{0%{transform:scale(.1);opacity:1}100%{transform:scale(5);opacity:0}}
.fxtxt i{display:inline-block;font-style:normal;animation:fxlet .5s cubic-bezier(.2,1.7,.3,1) calc(.08s + var(--i)*.05s) both}
@keyframes fxlet{0%{transform:translateY(.7em) scale(2.2) rotate(8deg);opacity:0;filter:blur(8px)}}
.fxov.win .fxtxt,.fxov.spec .fxtxt{animation:fxin .55s cubic-bezier(.2,1.5,.3,1) both,fxbeat .9s ease-in-out .9s 2}
@keyframes fxbeat{50%{transform:scale(1.06);text-shadow:0 0 30px currentColor,0 0 90px currentColor}}
.fxov.win .fxsub,.fxov.spec .fxsub{animation:fxsubw .9s cubic-bezier(.2,1,.3,1) .45s both}
@keyframes fxsubw{0%{letter-spacing:1.6em;opacity:0}}
.fxov.lose{box-shadow:inset 0 0 140px 40px rgba(255,43,214,.3)}
.fxov.lose .fxtxt i{animation-name:fxfall}
@keyframes fxfall{0%{transform:translateY(-1.2em);opacity:0}70%{transform:translateY(.08em)}}
.fxov.lose{color:var(--mg)}
.fxov.draw{color:var(--tx)}
.fxov.lose .fxtxt{font-size:clamp(30px,9vw,80px)}
.fxp{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);background:currentColor;box-shadow:0 0 10px currentColor;animation:fxp 1.2s cubic-bezier(.1,.8,.3,1) var(--d) both}
.fxp:nth-child(3n){color:var(--cy)}
.fxp:nth-child(3n+1){color:var(--mg)}
@keyframes fxp{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(0) rotate(200deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.fx *{animation:none!important}.fxov{display:none}}
.connect4 .win .stone{animation:pulse .8s infinite alternate}
@keyframes drop{0%{transform:translateY(-420%);opacity:.3}55%{transform:translateY(0);opacity:1;animation-timing-function:ease-out}70%{transform:translateY(-22%) scaleY(1.04);animation-timing-function:ease-in}84%{transform:translateY(0) scaleY(.92)}92%{transform:translateY(-6%)}100%{transform:none}}
.game{background:#03050d;border:1px solid var(--line);color:var(--tx);padding:12px;min-height:84px;cursor:pointer;text-align:left;font-family:inherit;transition:.15s;display:flex;flex-direction:column;justify-content:space-between;gap:8px}

  background:#03060f;border:1px solid var(--cy);box-shadow:0 0 24px rgba(0,240,255,.35),inset 0 0 40px rgba(0,240,255,.06)}

.roles button.on.r2{border-color:var(--mg);color:var(--mg);background:rgba(255,43,214,.12)}

.tag.kick:hover{background:rgba(255,43,214,.15)}

function joinRoom() {

  ui.screen = 'connecting'; ui.status = 'CONNECTING...'; render();
  const base = TOPIC + me.code;
  const c = net = mqtt.connect(BROKERS[Number(me.code[5]) - 1], { connectTimeout: 8000, reconnectPeriod: 3000, keepalive: 20 });
  const up = c.up = m => { if (c.connected) c.publish(base + '/up', JSON.stringify(Object.assign({ cid: me.cid, name: me.name }, m)), { qos: 1 }); };
  joinTimer = setTimeout(() => {

    if (net !== c) return;

    if (m.t === 'closed') { if (gotState) { ui.offline = true; render(); } return; }
    if (m.t !== 'state' || !m.s || !Array.isArray(m.s.members)) return;
    if (!gotState && (m.s.dup || []).some(d => d.c === me.cid && d.n === me.name.toLowerCase())) { fail('同じ名前のメンバーがすでにいます。別の名前で入り直してください。'); return; }
    if ((m.s.kicked || []).includes(me.cid)) { exitRoom('ホストにKICKされました。'); return; }
    if (!m.s.members.some(x => x.cid === me.cid)) { if (gotState) up({ t: 'hello' }); return; }
    S = m.s; gotState = true; ui.screen = 'room'; ui.offline = false;

  c.on('error', () => {});
}

      if (setup) { ui.hbMine = { gid: S.hb.gid, n }; store.set('cb_hb', JSON.stringify(ui.hbMine), true); }
      ui.hbIn = ''; act({ t: 'move', i: (setup ? 10000 : 20000) + Number(n) }); render();
    }
  }
  else if (a === 'ghand') { const z = Number(el.dataset.z); ui.gs = ui.gs && ui.gs.k === 'h' && ui.gs.size === z ? null : { k: 'h', size: z }; render(); }
  else if (a === 'gcell') {
    const i = Number(el.dataset.i), g = S.g, my = colorOf(me.cid), sel = ui.gs;
    const size = !sel ? 0 : sel.k === 'h' ? sel.size : gTop(g.st[sel.from]) % 10, from = sel && sel.k === 'b' && sel.from === i;
    if (sel && !from && gCan(g, size, i)) { ui.gs = null; act({ t: 'move', i: sel.k === 'h' ? 1000 + size * 10 + i : 2000 + sel.from * 10 + i }); }
    else if (Math.floor(gTop(g.st[i]) / 10) === my) { ui.gs = from ? null : { k: 'b', from: i }; render(); }
  }
  else if (a === 'qmode') { ui.qmode = el.dataset.m; ui.qa = -1; render(); }
  else if (a === 'qa') { ui.qa = Number(el.dataset.a); render(); }
  else if (a === 'qrot') { ui.qo = ui.qo === 'h' ? 'v' : 'h'; render(); }
  else if (a === 'qput') { const i = (ui.qo === 'h' ? 100 : 200) + ui.qa; if (ui.qa >= 0) { ui.qa = -1; act({ t: 'move', i }); } }
  else if (a === 'put') { const i = ui.sel; ui.sel = -1; if (i >= 0) act({ t: 'move', i }); }
  else if (a === 'nudge') {
    const n = 15, d = Number(el.dataset.d), s = ui.sel < 0 ? 112 : ui.sel;
    const x = s % n + (d === 1 ? 1 : d === 3 ? -1 : 0), y = Math.floor(s / n) + (d === 2 ? 1 : d === 0 ? -1 : 0);
    if (ui.sel < 0) { ui.sel = s; render(); }
    else if (x >= 0 && x < n && y >= 0 && y < n) { ui.sel = y * n + x; render(); }
  }
  else if (a === 'resign') { if (confirm('投了しますか？')) act({ t: 'resign' }); }
  else if (!host || !S) return;
  else if (a === 'game') { if (S.phase === 'lobby' && GAMES[el.dataset.g]) { S.game = el.dataset.g; setNp((GAMES[S.game].modes || []).includes(S.np) ? S.np : 2); broadcast(); } }
  else if (a === 'dvar') { if (S.phase === 'lobby') { S.dv = el.dataset.v === 'ci' ? 'ci' : 'sq'; broadcast(); } }
  else if (a === 'np') { const n = Number(el.dataset.n); if (S.phase === 'lobby' && (GAMES[S.game].modes || []).includes(n)) { setNp(n); broadcast(); } }
  else if (a === 'role') setRole(el.dataset.cid, el.dataset.role);
  else if (a === 'statreset') { if (confirm('全員の勝敗記録をリセットしますか？')) { S.stats = {}; broadcast(); } }
  else if (a === 'kick') {
    const m = S.members.find(x => x.cid === el.dataset.cid);
    if (m && !m.host && confirm(m.name + ' をKICKしますか？' + (colorOf(m.cid) && S.phase === 'playing' ? ' 対戦中のため、ゲームは中断されます。' : ''))) removeMember(m.cid, true);
  }
  else if (a === 'start') { if (me.isHost) startGame(); }
  else if (a === 'pick') { if (me.isHost) pickFirst(Number(el.dataset.f)); }
  else if (a === 'rule') { ui.rule = true; render(); }
  else if (a === 'rulex') { ui.rule = false; render(); }
  else if (a === 'pickx') { if (me.isHost) { S.phase = 'lobby'; broadcast(); } }

  else if (a === 'lobby') { if (S.phase !== 'playing' || confirm('ゲームを中断しますか？')) { S.phase = 'lobby'; S.members = S.members.filter(m => m.online || m.role !== 'spec'); broadcast(); } }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || ui.screen !== 'entry') return;
  const b = document.querySelector(e.target.id === 'code' ? '[data-act=join]' : e.target.id === 'name' && me.code ? '[data-act=join]' : null);
  if (b) b.click();
});

// ---------- boot ----------
(function boot() {
  const q = (new URLSearchParams(location.search).get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  me.code = q;
  if (typeof mqtt === 'undefined') { ui.error = '通信ライブラリを読み込めませんでした。ネット接続を確認して再読み込みしてください。'; render(); return; }
  if (CODE_RE.test(q) && me.name && store.get('cb_host', true) === q) { rehost = true; createRoom(); return; }
  if (CODE_RE.test(q) && me.name && store.get('cb_guest', true) === q) { joinRoom(); return; }
  render();
})();
</script>
